name: Deploying K8s Project

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_IMAGE: nischit007/task-manager-frontend
  BACKEND_IMAGE: nischit007/task-manager-backend
  TAG: latest

